appId: app.thehinterlandguide
name: observation_play_internal
tags:
  - play-internal
  - observation
---
- addMedia:
    - "../../assets/images/icon.png"
- launchApp:
    clearState: false
- tapOn:
    id: "tab-journal"
- extendedWaitUntil:
    visible:
      id: "field-journal-screen"
    timeout: 30000
- extendedWaitUntil:
    visible: "Your Field Journal is empty"
    timeout: 30000
- extendedWaitUntil:
    visible:
      id: "tab-observe"
    timeout: 30000
- tapOn:
    id: "tab-observe"
- assertVisible:
    id: "observe-screen"
- scrollUntilVisible:
    element:
      id: "observation-library-button"
    direction: DOWN
    timeout: 20000
    speed: 40
    visibilityPercentage: 100
    centerElement: true
- tapOn:
    id: "observation-library-button"
- runFlow: "../partials/pick_first_android_image.yaml"
- extendedWaitUntil:
    visible:
      id: "observation-confirm-screen"
    timeout: 30000
- assertVisible:
    id: "observation-confirm-image"
- scrollUntilVisible:
    element:
      id: "observation-confirm-button"
    direction: DOWN
    timeout: 20000
    speed: 40
    visibilityPercentage: 100
    centerElement: true
- tapOn:
    id: "observation-confirm-button"
- extendedWaitUntil:
    visible:
      id: "observation-submit-screen"
    timeout: 30000
- scrollUntilVisible:
    element:
      id: "observation-no-location-button"
    direction: DOWN
    timeout: 20000
    speed: 40
    visibilityPercentage: 100
    centerElement: true
- tapOn:
    id: "observation-no-location-button"
- scrollUntilVisible:
    element:
      id: "observation-unknown-button"
    direction: DOWN
    timeout: 20000
    speed: 40
    visibilityPercentage: 100
    centerElement: true
- tapOn:
    id: "observation-unknown-button"
- scrollUntilVisible:
    element:
      id: "observation-save-button"
    direction: DOWN
    timeout: 20000
    speed: 40
    visibilityPercentage: 100
    centerElement: true
- tapOn:
    id: "observation-save-button"
- extendedWaitUntil:
    visible:
      id: "observation-stage-complete"
    timeout: 120000
- extendedWaitUntil:
    visible:
      id: "observation-created-pending-status"
    timeout: 30000
- evalScript: ${output.w1VisibleDeadlineMs = new Date().getTime() + 160000}
- assertVisible: "This photo is being checked."
- scrollUntilVisible:
    element:
      id: "observation-done-button"
    direction: DOWN
    timeout: 20000
    speed: 40
    visibilityPercentage: 100
    centerElement: true
- tapOn:
    id: "observation-done-button"
- extendedWaitUntil:
    visible:
      id: "field-journal-screen"
    timeout: 30000
- runFlow:
    file: "../partials/assert_saved_observation_pilot_private.yaml"
    env:
      W1_VISIBLE_DEADLINE_MS: ${output.w1VisibleDeadlineMs}
