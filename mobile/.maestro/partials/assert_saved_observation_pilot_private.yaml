appId: app.thehinterlandguide
---
- scrollUntilVisible:
    element:
      id: "field-journal-observation-card"
    direction: DOWN
    timeout: 20000
    speed: 40
    visibilityPercentage: 100
    centerElement: true
- assertNotVisible:
    id: "field-journal-photo-image"
- extendedWaitUntil:
    visible:
      id: "field-journal-private-status"
    timeout: ${Math.max(1, Number(W1_VISIBLE_DEADLINE_MS) - new Date().getTime())}
- assertTrue:
    condition: ${new Date().getTime() <= Number(W1_VISIBLE_DEADLINE_MS)}
    label: "pilot_private became visible within 160 seconds of the persisted pending response"
- assertVisible:
    id: "field-journal-observation-card"
- assertVisible: "This photo is private during the pilot."
- assertNotVisible:
    id: "field-journal-photo-image"
- tapOn:
    id: "field-journal-observation-card"
- extendedWaitUntil:
    visible:
      id: "observation-detail-screen"
    timeout: 30000
- assertVisible:
    id: "observation-detail-private-status"
- assertVisible: "This photo is private during the pilot."
- assertNotVisible:
    id: "observation-detail-photo-image"
- takeScreenshot: "w1-pilot-private-observation"
- scrollUntilVisible:
    element:
      text: "Manual identification correction"
    direction: DOWN
    timeout: 20000
    speed: 40
    visibilityPercentage: 100
    centerElement: true
- assertNotVisible:
    id: "observation-photo-helper-button"
