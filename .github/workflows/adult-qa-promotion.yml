                  grep -Fx "${variable}" <<<"${env_names}" || true
                done
              } | sort -u
            )
            if [[ "${job}" != hinterland-qa-moderation ]]; then
              for variable in \
                HINTERLAND_CONTENT_SAFETY_ENDPOINT \
                HINTERLAND_CONTENT_SAFETY_KEY; do
