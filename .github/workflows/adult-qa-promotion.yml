            HINTERLAND_SHARED_GROUPS_ENABLED="${SHARED_GROUPS_ENABLED}"
            HINTERLAND_SHARED_GROUPS_CANARY_GROUP_IDS=[]
            HINTERLAND_PHOTOS_BUCKET="${AZURE_PHOTOS_CONTAINER}"
            HINTERLAND_TAXONOMY_PACKS_BUCKET="${AZURE_TAXONOMY_PACKS_CONTAINER}"
            HINTERLAND_OBSERVATION_IDEMPOTENCY_REQUIRED=true
            HINTERLAND_CONTENT_ROOT=/app/content/expeditions
            HINTERLAND_STORAGE_PROVIDER=blob
            HINTERLAND_BLOB_ACCOUNT_ENDPOINT="${QA_BLOB_ACCOUNT_ENDPOINT}"
            HINTERLAND_ENTRA_TENANT_ID="${QA_ENTRA_TENANT_ID}"
            HINTERLAND_ENTRA_API_AUDIENCE="${QA_ENTRA_API_AUDIENCE}"
            HINTERLAND_ENTRA_CLIENT_APP_ID="${QA_ENTRA_CLIENT_ID}"
            HINTERLAND_ENTRA_REQUIRED_SCOPE=user.access
            HINTERLAND_ENTRA_ISSUER="https://login.microsoftonline.com/${QA_ENTRA_TENANT_ID}/v2.0"
            HINTERLAND_ENTRA_JWKS_URL="https://login.microsoftonline.com/${QA_ENTRA_TENANT_ID}/discovery/v2.0/keys"
            HINTERLAND_KID_JWT_ISSUER="${QA_KID_JWT_ISSUER}"
            HINTERLAND_KID_JWT_AUDIENCE="${QA_KID_JWT_AUDIENCE}"
            HINTERLAND_KID_JWT_KID="${QA_KID_JWT_KID}"
            HINTERLAND_KEY_VAULT_URL="${QA_KEY_VAULT_URL}"
            HINTERLAND_KEY_VAULT_KID_SIGNING_SECRET="${QA_KID_SIGNING_SECRET}"
            HINTERLAND_KEY_VAULT_KID_PUBLIC_SECRET="${QA_KID_PUBLIC_SECRET}"
            HINTERLAND_INAT_BASE_URL=https://api.inaturalist.org/v1
            HINTERLAND_INAT_CV_ENABLED=false
            HINTERLAND_INAT_CV_DISCLOSURE_APPROVED=false
            HINTERLAND_INAT_CV_BENCHMARK_APPROVED=false
            HINTERLAND_INAT_CV_QUALIFICATION_ENABLED=false
            HINTERLAND_INAT_SUBMIT_ENABLED=false
            HINTERLAND_ORGANISM_FALLBACK_PROVIDER=noop
            HINTERLAND_GEOCODING_PROVIDER=noop
            HINTERLAND_MODERATION_PROVIDER=noop
            HINTERLAND_SERVICE_BUS_NAMESPACE="${AZURE_SERVICE_BUS_NAMESPACE}.servicebus.windows.net"
            HINTERLAND_SERVICE_BUS_MODERATION_QUEUE="${AZURE_MODERATION_QUEUE}"
            HINTERLAND_SERVICE_BUS_INAT_QUEUE="${AZURE_DISABLED_INAT_QUEUE}"
            HINTERLAND_DATABASE_HOST="${AZURE_POSTGRES_HOST}"
            HINTERLAND_DATABASE_PORT=5432
            HINTERLAND_DATABASE_NAME="${AZURE_POSTGRES_DATABASE}"
            HINTERLAND_DATABASE_USER="${AZURE_POSTGRES_USER}"
            HINTERLAND_DATABASE_PASSWORD=secretref:pg-password
            HINTERLAND_READINESS_DATABASE_REQUIRED=true
            HINTERLAND_DEV_AUTH_ENABLED=false
            HINTERLAND_ALLOW_STUB_AUTH=false
          )
          retired_exact=(
            HINTERLAND_DATABASE_PASSWORD_SECRET
            HINTERLAND_DEV_AUTH_TOKEN
            HINTERLAND_KID_JWT_SIGNING_PEM
            HINTERLAND_KID_JWT_PUBLIC_PEM
            HINTERLAND_INAT_OAUTH_TOKEN
            HINTERLAND_INAT_CV_TOKEN
            HINTERLAND_INAT_CV_QUALIFICATION_KEY
            HINTERLAND_INAT_CV_QUALIFICATION_RUN_ID
            HINTERLAND_INAT_CV_QUALIFICATION_MANIFEST_SHA256
