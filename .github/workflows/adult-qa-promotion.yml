name: Adult QA promotion

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type PROMOTE_ADULT_QA after reviewing the QA cost approval and runbook
        required: true
        type: string
      enable_cv:
        description: Enable user-requested post-clean iNaturalist CV
        required: true
        default: false
        type: boolean
      cv_disclosure_approved:
        description: Confirm the current Adult QA disclosure is approved
        required: true
        default: false
        type: boolean
      cv_benchmark_approved:
        description: Confirm the 50-photo Adult QA benchmark passed
        required: true
        default: false
        type: boolean
      cv_qualification_run_id:
        description: Approved bounded CV qualification run ULID (required only when CV is enabled)
        required: false
        default: ""
        type: string
      cv_qualification_evidence_sha256:
        description: SHA-256 of the approved aggregate qualification evidence
        required: false
        default: ""
        type: string
      shared_groups_enabled:
        description: Enable shared Groups only after the two-family access matrix passed
        required: true
        default: false
        type: boolean

concurrency:
  group: adult-qa-runtime-mutation
  cancel-in-progress: false

env:
  AZURE_SUBSCRIPTION_ID_EXPECTED: 3ac5dfb0-91b7-47d3-8187-9dc8d6305e96
  AZURE_TENANT_ID_EXPECTED: 18dbd7fa-c411-49bc-82fc-9ccaa26e3404
  AZURE_RESOURCE_GROUP: hinterland-qa-rg
  AZURE_SHARED_RESOURCE_GROUP: hinterland-dev-rg
  AZURE_LOCATION_EXPECTED: centralus
  AZURE_ACR_NAME: hinterlandacrdev
  AZURE_LOG_ANALYTICS_WORKSPACE: hinterland-law-dev
  AZURE_POSTGRES_SERVER: hinterland-postgres-dev
  AZURE_POSTGRES_HOST: hinterland-postgres-dev.postgres.database.azure.com
  AZURE_POSTGRES_DATABASE: hinterland_qa
  AZURE_POSTGRES_USER: hinterland_qa_app
  AZURE_CONTAINER_APP_ENV: hinterland-cae-qa
  AZURE_CONTAINER_APP: hinterland-api-qa
  AZURE_API_UAMI: hinterland-api-qa-mi
  AZURE_JOBS_UAMI: hinterland-jobs-qa-mi
  AZURE_KEY_VAULT: hinterland-kv-qa
  AZURE_STORAGE_ACCOUNT: hinterlandphotosqa
  AZURE_PHOTOS_CONTAINER: qa-photos
  AZURE_TAXONOMY_PACKS_CONTAINER: qa-taxonomy-packs
  AZURE_SERVICE_BUS_NAMESPACE: hinterland-sb-qa
  AZURE_MODERATION_QUEUE: moderation-pending-qa
  AZURE_DISABLED_INAT_QUEUE: disabled-no-public-submit
  AZURE_CONTENT_SAFETY_ACCOUNT: hinterland-content-safety-qa
  AZURE_PARENT_SWA: hinterland-parents-qa-swa
  AZURE_ACTION_GROUP: hinterland-ops-qa
  IMAGE_REPOSITORY: hinterland-api
  QA_API_ORIGIN: https://qa-api.thehinterlandguide.app
  QA_PARENT_ORIGIN: https://qa-parents.thehinterlandguide.app
  QA_CORS_ORIGINS: '["https://qa-parents.thehinterlandguide.app"]'
  QA_CONSENT_POLICY_VERSION: 2026-07-30-ADULT-QA-EGRESS-V1
  QA_KEY_VAULT_URL: https://hinterland-kv-qa.vault.azure.net/
  QA_BLOB_ACCOUNT_ENDPOINT: https://hinterlandphotosqa.blob.core.windows.net
  QA_KID_JWT_ISSUER: https://qa-api.thehinterlandguide.app
  QA_KID_JWT_AUDIENCE: hinterland-api-qa
  QA_KID_JWT_KID: k1-adult-qa-2026-07
  QA_KID_SIGNING_SECRET: qa-kid-jwt-signing-key
  QA_KID_PUBLIC_SECRET: qa-kid-jwt-public-key
  QA_ENTRA_TENANT_ID: ${{ vars.HINTERLAND_QA_ENTRA_TENANT_ID }}
  QA_ENTRA_API_AUDIENCE: ${{ vars.HINTERLAND_QA_ENTRA_API_AUDIENCE }}
  QA_ENTRA_CLIENT_ID: ${{ vars.HINTERLAND_QA_ENTRA_CLIENT_ID }}
  HINTERLAND_KID_JWKS_PATH: /.well-known/hinterland-kid-jwks.json
  CV_ENABLED: ${{ inputs.enable_cv }}
  CV_DISCLOSURE_APPROVED: ${{ inputs.cv_disclosure_approved }}
  CV_BENCHMARK_APPROVED: ${{ inputs.cv_benchmark_approved }}
  CV_QUALIFICATION_RUN_ID: ${{ inputs.cv_qualification_run_id }}
  CV_QUALIFICATION_EVIDENCE_SHA256: ${{ inputs.cv_qualification_evidence_sha256 }}
  SHARED_GROUPS_ENABLED: ${{ inputs.shared_groups_enabled }}

jobs:
  promote:
    name: Strict Adult QA promotion and evidence
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment:
      name: adult-qa-promotion
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Require main, adult approval, and coherent CV gates
        env:
          PROMOTION_CONFIRMATION: ${{ inputs.confirmation }}
          COST_APPROVAL_ID: ${{ vars.HINTERLAND_QA_COST_APPROVAL_ID }}
          APPROVED_CV_RUN_ID: ${{ vars.HINTERLAND_QA_CV_APPROVED_RUN_ID }}
          APPROVED_CV_EVIDENCE_SHA256: ${{ vars.HINTERLAND_QA_CV_APPROVED_EVIDENCE_SHA256 }}
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/main"
          test "${GITHUB_SHA}" = "$(git rev-parse HEAD)"
          test "${PROMOTION_CONFIRMATION}" = "PROMOTE_ADULT_QA"
          test -n "${COST_APPROVAL_ID}"
          test -n "${QA_ENTRA_TENANT_ID}"
          test -n "${QA_ENTRA_API_AUDIENCE}"
          test -n "${QA_ENTRA_CLIENT_ID}"
          test "${QA_ENTRA_API_AUDIENCE}" != "REQUIRED_QA_ENTRA_API_APP_ID"
          test "${QA_ENTRA_CLIENT_ID}" != "REQUIRED_QA_ENTRA_CLIENT_APP_ID"
          test "${QA_ENTRA_API_AUDIENCE}" != \
            "7dd9da3c-b7d6-45d4-955b-d7561c43f209"
          test "${QA_ENTRA_CLIENT_ID}" != \
            "60504e4c-6b5f-4031-a80a-3e4bdfae29b2"
          if [[ "${CV_ENABLED}" == true ]]; then
            test "${CV_DISCLOSURE_APPROVED}" = true
            test "${CV_BENCHMARK_APPROVED}" = true
            [[ "${CV_QUALIFICATION_RUN_ID}" =~ ^[0-9A-HJKMNP-TV-Z]{26}$ ]]
            [[ "${CV_QUALIFICATION_EVIDENCE_SHA256}" =~ ^[0-9a-f]{64}$ ]]
            test "${CV_QUALIFICATION_RUN_ID}" = "${APPROVED_CV_RUN_ID}"
            test "${CV_QUALIFICATION_EVIDENCE_SHA256}" = \
              "${APPROVED_CV_EVIDENCE_SHA256}"
          else
            test "${CV_DISCLOSURE_APPROVED}" = false
            test "${CV_BENCHMARK_APPROVED}" = false
            test -z "${CV_QUALIFICATION_RUN_ID}"
            test -z "${CV_QUALIFICATION_EVIDENCE_SHA256}"
          fi

      - name: Initialize sanitized evidence
        run: |
          set -euo pipefail
          mkdir -p promotion-artifact
          echo '[]' > promotion-artifact/job-executions.json
          jq -n \
            --arg generated_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg commit_sha "${GITHUB_SHA}" \
            --arg run_id "${GITHUB_RUN_ID}" \
            --argjson cv_enabled "${CV_ENABLED}" \
            --argjson shared_groups_enabled "${SHARED_GROUPS_ENABLED}" \
            --arg cv_qualification_run_id "${CV_QUALIFICATION_RUN_ID}" \
            --arg cv_qualification_evidence_sha256 \
              "${CV_QUALIFICATION_EVIDENCE_SHA256}" \
            '{
              schema_version: 1,
              classification: "sanitized-adult-qa-promotion-evidence",
              generated_at: $generated_at,
              commit_sha: $commit_sha,
              workflow_run_id: $run_id,
              release_lane: "adult_qa",
              cv_enabled: $cv_enabled,
              cv_qualification_run_id:
                (if $cv_qualification_run_id == "" then null
                 else $cv_qualification_run_id end),
              cv_qualification_evidence_sha256:
                (if $cv_qualification_evidence_sha256 == "" then null
                 else $cv_qualification_evidence_sha256 end),
              shared_groups_enabled: $shared_groups_enabled,
              public_inaturalist_submission: "disabled",
              result: "running"
            }' > promotion-artifact/promotion.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Require a fresh dedicated QA test-parent credential
        env:
          HINTERLAND_QA_SMOKE_ENTRA_BEARER: ${{ secrets.HINTERLAND_QA_SMOKE_ENTRA_BEARER }}
          HINTERLAND_QA_ENTRA_API_AUDIENCE: ${{ vars.HINTERLAND_QA_ENTRA_API_AUDIENCE }}
          HINTERLAND_QA_ENTRA_CLIENT_ID: ${{ vars.HINTERLAND_QA_ENTRA_CLIENT_ID }}
          HINTERLAND_QA_ENTRA_TENANT_ID: ${{ vars.HINTERLAND_QA_ENTRA_TENANT_ID }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import json
          import os
          import time

          token = os.environ.get("HINTERLAND_QA_SMOKE_ENTRA_BEARER", "").strip()
          if not token:
              raise SystemExit(
                  "HINTERLAND_QA_SMOKE_ENTRA_BEARER is required; "
                  "authenticated checks never skip"
              )
          try:
              payload = token.split(".", 2)[1]
              payload += "=" * (-len(payload) % 4)
              claims = json.loads(base64.urlsafe_b64decode(payload.encode("ascii")))
              expires_at = int(claims["exp"])
          except Exception as exc:
              raise SystemExit("QA test-parent credential is not a JWT with exp") from exc

          tenant = os.environ["HINTERLAND_QA_ENTRA_TENANT_ID"]
          audience = os.environ["HINTERLAND_QA_ENTRA_API_AUDIENCE"]
          client_id = os.environ["HINTERLAND_QA_ENTRA_CLIENT_ID"]
          accepted_audiences = {audience, audience.removeprefix("api://")}
          expected_issuer = f"https://login.microsoftonline.com/{tenant}/v2.0"
          if claims.get("ver") != "2.0":
              raise SystemExit("QA test-parent credential is not an Entra v2 token")
          if claims.get("tid") != tenant or claims.get("iss") != expected_issuer:
              raise SystemExit("QA test-parent credential has the wrong tenant or issuer")
          if claims.get("aud") not in accepted_audiences:
              raise SystemExit("QA test-parent credential has the wrong audience")
          if claims.get("azp") != client_id:
              raise SystemExit("QA test-parent credential has the wrong client")
          if "user.access" not in str(claims.get("scp", "")).split():
              raise SystemExit("QA test-parent credential lacks user.access")
          if not claims.get("oid"):
              raise SystemExit("QA test-parent credential has no object identity")
          if expires_at - int(time.time()) < 1_800:
              raise SystemExit(
                  "QA test-parent credential needs at least 1,800 seconds remaining"
              )
          PY

      - name: Install and verify backend contracts
        working-directory: backend
        run: |
          set -euo pipefail
          uv sync --locked
          uv run ruff check app tests
          uv run mypy app
          uv run pytest -q -m "not integration and not postgres"

      - name: Verify Observation contract on disposable PostgreSQL
        run: |
          set -euo pipefail
          pwsh -NoProfile -File scripts/verify_observation_postgres.ps1 \
            -DispatcherSamples 50
          jq '.postgres_verification={
                result:"passed",
                dispatcher_samples:50
              }' promotion-artifact/promotion.json \
            > promotion-artifact/promotion.tmp
          mv promotion-artifact/promotion.tmp promotion-artifact/promotion.json

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Verify Adult QA mobile and parent-web contracts
        working-directory: mobile
        env:
          APP_ENV: adult-qa
          HINTERLAND_QA_EAS_PROJECT_ID: ${{ vars.HINTERLAND_QA_EAS_PROJECT_ID }}
          HINTERLAND_QA_ENTRA_API_AUDIENCE: ${{ vars.HINTERLAND_QA_ENTRA_API_AUDIENCE }}
          HINTERLAND_QA_ENTRA_CLIENT_ID: ${{ vars.HINTERLAND_QA_ENTRA_CLIENT_ID }}
          HINTERLAND_QA_ENTRA_TENANT_ID: ${{ vars.HINTERLAND_QA_ENTRA_TENANT_ID }}
        run: |
          set -euo pipefail
          npm ci
          npm run typecheck
          npm test -- --runInBand
          npm run config:adult-qa

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Run read-only isolation and cost-contract preflight
        run: |
          set -euo pipefail
          pwsh -NoProfile -File infra-azure/adult-qa-preflight.ps1 \
            -Mode PromotionReadiness \
            -OutputPath promotion-artifact/preflight.json

      - name: Verify exact QA resource placement and shared-service allowlist
        run: |
          set -euo pipefail
          test "${AZURE_RESOURCE_GROUP}" = "hinterland-qa-rg"
          test "${AZURE_RESOURCE_GROUP}" != "hinterland-dev-rg"
          test "${AZURE_RESOURCE_GROUP}" != "gordi-pilot-rg"
          test "$(az account show --query id --output tsv)" = \
            "${AZURE_SUBSCRIPTION_ID_EXPECTED}"
          test "$(az account show --query tenantId --output tsv)" = \
            "${AZURE_TENANT_ID_EXPECTED}"

          group_json="$(az group show --name "${AZURE_RESOURCE_GROUP}" --output json)"
          test "$(jq -r '.location | ascii_downcase | gsub(" ";"")' <<<"${group_json}")" = centralus
          test "$(jq -r '.tags.environment // empty' <<<"${group_json}")" = adult-qa
          test "$(jq -r '.tags["release-lane"] // empty' <<<"${group_json}")" = adult_qa

          # The shared allowlist is exactly ACR, Log Analytics, and the
          # PostgreSQL server. No data-bearing QA resource may resolve to W1.
          acr_id="$(az acr show --name "${AZURE_ACR_NAME}" --query id --output tsv)"
          [[ "${acr_id,,}" == *"/resourcegroups/${AZURE_SHARED_RESOURCE_GROUP}/"* ]]
          az monitor log-analytics workspace show \
            --resource-group "${AZURE_SHARED_RESOURCE_GROUP}" \
            --workspace-name "${AZURE_LOG_ANALYTICS_WORKSPACE}" \
            --output none
          postgres_json="$(az postgres flexible-server show \
            --resource-group "${AZURE_SHARED_RESOURCE_GROUP}" \
            --name "${AZURE_POSTGRES_SERVER}" --output json)"
          test "$(jq -r '.location | ascii_downcase | gsub(" ";"")' <<<"${postgres_json}")" = centralus
          az postgres flexible-server db show \
            --resource-group "${AZURE_SHARED_RESOURCE_GROUP}" \
            --server-name "${AZURE_POSTGRES_SERVER}" \
            --database-name "${AZURE_POSTGRES_DATABASE}" \
            --output none
          test "${AZURE_POSTGRES_DATABASE}" != hinterland

          for resource in \
            "${AZURE_KEY_VAULT}" \
            "${AZURE_STORAGE_ACCOUNT}" \
            "${AZURE_SERVICE_BUS_NAMESPACE}" \
            "${AZURE_CONTENT_SAFETY_ACCOUNT}" \
            "${AZURE_CONTAINER_APP_ENV}" \
            "${AZURE_CONTAINER_APP}" \
            "${AZURE_API_UAMI}" \
            "${AZURE_JOBS_UAMI}"; do
            case "${resource}" in
              hinterland-kv-dev|hinterlandphotosdev|hinterland-sb-dev|\
              hinterland-api-central|hinterland-api|hinterland-api-central-mi|\
              hinterland-api-mi|hinterland-cae-central-dev|hinterland-cae-dev)
                echo "Protected W1 resource selected: ${resource}" >&2
                exit 1
                ;;
            esac
          done

          az keyvault show --name "${AZURE_KEY_VAULT}" \
            --resource-group "${AZURE_RESOURCE_GROUP}" --output none
          az storage account show --name "${AZURE_STORAGE_ACCOUNT}" \
            --resource-group "${AZURE_RESOURCE_GROUP}" --output none
          az servicebus namespace show --name "${AZURE_SERVICE_BUS_NAMESPACE}" \
            --resource-group "${AZURE_RESOURCE_GROUP}" --output none
          az cognitiveservices account show --name "${AZURE_CONTENT_SAFETY_ACCOUNT}" \
            --resource-group "${AZURE_RESOURCE_GROUP}" --output none
          az containerapp env show --name "${AZURE_CONTAINER_APP_ENV}" \
            --resource-group "${AZURE_RESOURCE_GROUP}" --output none
          az containerapp show --name "${AZURE_CONTAINER_APP}" \
            --resource-group "${AZURE_RESOURCE_GROUP}" --output none
          az identity show --name "${AZURE_API_UAMI}" \
            --resource-group "${AZURE_RESOURCE_GROUP}" --output none
          az identity show --name "${AZURE_JOBS_UAMI}" \
            --resource-group "${AZURE_RESOURCE_GROUP}" --output none
          az staticwebapp show --name "${AZURE_PARENT_SWA}" \
            --resource-group "${AZURE_RESOURCE_GROUP}" --output none

      - name: Verify dedicated runtime identities and least-privilege boundaries
        run: |
          set -euo pipefail
          api_identity_json="$(az identity show \
            --name "${AZURE_API_UAMI}" \
            --resource-group "${AZURE_RESOURCE_GROUP}" --output json)"
          jobs_identity_json="$(az identity show \
            --name "${AZURE_JOBS_UAMI}" \
            --resource-group "${AZURE_RESOURCE_GROUP}" --output json)"
          api_identity_id="$(jq -r '.id' <<<"${api_identity_json}")"
          jobs_identity_id="$(jq -r '.id' <<<"${jobs_identity_json}")"
          api_identity_client_id="$(jq -r '.clientId' <<<"${api_identity_json}")"
          jobs_identity_client_id="$(jq -r '.clientId' <<<"${jobs_identity_json}")"
          api_principal_id="$(jq -r '.principalId' <<<"${api_identity_json}")"
          jobs_principal_id="$(jq -r '.principalId' <<<"${jobs_identity_json}")"
          test -n "${api_identity_id}"
          test -n "${jobs_identity_id}"
          test -n "${api_identity_client_id}"
          test -n "${jobs_identity_client_id}"
          test "${api_identity_id,,}" != "${jobs_identity_id,,}"
          test "${api_identity_client_id,,}" != "${jobs_identity_client_id,,}"

          assert_only_identity() {
            local kind="$1" name="$2" expected_id="$3" identity
            if [[ "${kind}" = app ]]; then
              identity="$(az containerapp show \
                --name "${name}" \
                --resource-group "${AZURE_RESOURCE_GROUP}" \
                --query identity --output json)"
            else
              identity="$(az containerapp job show \
                --name "${name}" \
                --resource-group "${AZURE_RESOURCE_GROUP}" \
                --query identity --output json)"
            fi
            jq -e --arg expected "${expected_id,,}" '
              .type == "UserAssigned" and
              ((.userAssignedIdentities // {}) | length == 1) and
              ([((.userAssignedIdentities // {}) | keys[]) | ascii_downcase]
                | index($expected) != null)
            ' <<<"${identity}" >/dev/null
          }
          assert_only_identity app "${AZURE_CONTAINER_APP}" "${api_identity_id}"
          mapfile -t identity_jobs < <(az containerapp job list \
            --resource-group "${AZURE_RESOURCE_GROUP}" \
            --query '[].name' --output tsv)
          for job in "${identity_jobs[@]}"; do
            assert_only_identity job "${job}" "${jobs_identity_id}"
          done

          acr_id="$(az acr show --name "${AZURE_ACR_NAME}" \
            --query id --output tsv)"
          vault_id="$(az keyvault show --name "${AZURE_KEY_VAULT}" \
            --resource-group "${AZURE_RESOURCE_GROUP}" \
            --query id --output tsv)"
          storage_id="$(az storage account show \
            --name "${AZURE_STORAGE_ACCOUNT}" \
            --resource-group "${AZURE_RESOURCE_GROUP}" \
            --query id --output tsv)"
          service_bus_id="$(az servicebus namespace show \
            --name "${AZURE_SERVICE_BUS_NAMESPACE}" \
            --resource-group "${AZURE_RESOURCE_GROUP}" \
            --query id --output tsv)"
          moderation_queue_id="${service_bus_id}/queues/${AZURE_MODERATION_QUEUE}"

          require_role() {
            local principal="$1" role="$2" scope="$3" count
            count="$(az role assignment list \
              --assignee-object-id "${principal}" \
              --scope "${scope}" \
              --include-inherited \
              --query "[?roleDefinitionName=='${role}'] | length(@)" \
              --output tsv)"
            test "${count}" -ge 1
          }
          require_role "${api_principal_id}" AcrPull "${acr_id}"
          require_role "${api_principal_id}" \
            "Key Vault Secrets User" "${vault_id}"
          require_role "${api_principal_id}" \
            "Storage Blob Data Contributor" "${storage_id}"
          require_role "${api_principal_id}" \
            "Azure Service Bus Data Sender" "${moderation_queue_id}"
          require_role "${jobs_principal_id}" AcrPull "${acr_id}"
          require_role "${jobs_principal_id}" \
            "Key Vault Secrets User" "${vault_id}"
          require_role "${jobs_principal_id}" \
            "Storage Blob Data Contributor" "${storage_id}"
          require_role "${jobs_principal_id}" \
            "Azure Service Bus Data Sender" "${moderation_queue_id}"
          require_role "${jobs_principal_id}" \
            "Azure Service Bus Data Receiver" "${moderation_queue_id}"

          for principal in "${api_principal_id}" "${jobs_principal_id}"; do
            assignments="$(az role assignment list \
              --assignee-object-id "${principal}" --all --output json)"
            jq -e '
              all(.[];
                (.roleDefinitionName != "Owner") and
                (.roleDefinitionName != "Contributor") and
                (.roleDefinitionName != "User Access Administrator"))
            ' <<<"${assignments}" >/dev/null
            ! jq -r '.[].scope' <<<"${assignments}" | grep -Eqi \
              '(/resourceGroups/gordi-pilot-rg/|hinterland-kv-dev|hinterlandphotosdev|hinterland-sb-dev)'
          done

      - name: Verify domains, certificates, queues, lifecycle, and alerts
        env:
          HINTERLAND_QA_ALERT_EMAIL: ${{ secrets.HINTERLAND_QA_ALERT_EMAIL }}
        run: |
          set -euo pipefail
          app_json="$(az containerapp show --name "${AZURE_CONTAINER_APP}" \
            --resource-group "${AZURE_RESOURCE_GROUP}" --output json)"
          jq -e --arg domain "qa-api.thehinterlandguide.app" '
            any(.properties.configuration.ingress.customDomains[]?;
              .name == $domain and (.bindingType | length) > 0 and
              (.certificateId | length) > 0)
          ' <<<"${app_json}" >/dev/null
          az staticwebapp hostname show \
            --name "${AZURE_PARENT_SWA}" \
            --resource-group "${AZURE_RESOURCE_GROUP}" \
            --hostname "qa-parents.thehinterlandguide.app" \
            --output none

          queue_json="$(az servicebus queue show \
            --namespace-name "${AZURE_SERVICE_BUS_NAMESPACE}" \
            --resource-group "${AZURE_RESOURCE_GROUP}" \
            --name "${AZURE_MODERATION_QUEUE}" --output json)"
          test "$(jq -r '.deadLetteringOnMessageExpiration' <<<"${queue_json}")" = true
          test "$(jq -r '.maxDeliveryCount' <<<"${queue_json}")" -ge 5
          mapfile -t queue_names < <(az servicebus queue list \
            --namespace-name "${AZURE_SERVICE_BUS_NAMESPACE}" \
            --resource-group "${AZURE_RESOURCE_GROUP}" \
            --query '[].name' --output tsv)
          printf '%s\n' "${queue_names[@]}" | \
            grep -Fxq "${AZURE_MODERATION_QUEUE}"
          ! printf '%s\n' "${queue_names[@]}" | \
            grep -Eiq 'inat|inaturalist|submit'

          policy_json="$(az storage account management-policy show \
            --account-name "${AZURE_STORAGE_ACCOUNT}" \
            --resource-group "${AZURE_RESOURCE_GROUP}" --output json)"
          for rule in \
            adult-qa-unattached-upload-24h \
            adult-qa-quarantine-rejected-90d; do
            jq -e --arg rule "${rule}" '
              any(.policy.rules[]?; .name == $rule and .enabled == true)
            ' <<<"${policy_json}" >/dev/null
          done

          required_alerts=(
            hinterland-qa-moderation-age
            hinterland-qa-pending-photo-age
            hinterland-qa-moderation-queue
            hinterland-qa-moderation-dlq
            hinterland-qa-rebuild-backlog
            hinterland-qa-rebuild-failure
            hinterland-qa-dispatcher-work
            hinterland-qa-dispatcher-p95
            hinterland-qa-idempotency-conflicts
            hinterland-qa-state-mismatches
            hinterland-qa-failed-jobs
          )
          for alert in "${required_alerts[@]}"; do
            alert_json="$(az monitor scheduled-query show \
              --name "${alert}" --resource-group "${AZURE_RESOURCE_GROUP}" \
              --output json)"
            test "$(jq -r '.enabled' <<<"${alert_json}")" = true
            test "$(jq -r '.actions.actionGroups | length' <<<"${alert_json}")" -gt 0
          done

          action_group_json="$(az monitor action-group show \
            --name "${AZURE_ACTION_GROUP}" \
            --resource-group "${AZURE_RESOURCE_GROUP}" --output json)"
          receiver_name="$(jq -r --arg email "${HINTERLAND_QA_ALERT_EMAIL}" '
            [.emailReceivers[]? | select(
              (.emailAddress | ascii_downcase) == ($email | ascii_downcase)
              and .status == "Enabled"
            )][0].name // empty
          ' <<<"${action_group_json}")"
          receiver_email="$(jq -r --arg email "${HINTERLAND_QA_ALERT_EMAIL}" '
            [.emailReceivers[]? | select(
              (.emailAddress | ascii_downcase) == ($email | ascii_downcase)
              and .status == "Enabled"
            )][0].emailAddress // empty
          ' <<<"${action_group_json}")"
          test -n "${receiver_name}"
          test -n "${receiver_email}"
          az monitor action-group test-notifications create \
            --action-group "${AZURE_ACTION_GROUP}" \
            --resource-group "${AZURE_RESOURCE_GROUP}" \
            --alert-type logalertv2 \
            --add-action email "${receiver_name}" "${receiver_email}" \
              usecommonalertschema \
            --no-wait --output none
          jq -n \
            --arg tested_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg action_group "${AZURE_ACTION_GROUP}" \
            --argjson alert_count "${#required_alerts[@]}" \
            '{
              result:"accepted",
              tested_at:$tested_at,
              action_group:$action_group,
              required_alert_count:$alert_count
            }' > promotion-artifact/monitoring.json

      - name: Verify dedicated secrets without reading values
        run: |
          set -euo pipefail
          mapfile -t secret_names < <(az keyvault secret list \
            --vault-name "${AZURE_KEY_VAULT}" --query '[].name' --output tsv)
          printf '%s\n' "${secret_names[@]}" | grep -Fxq postgres-qa-password
          printf '%s\n' "${secret_names[@]}" | grep -Fxq content-safety-endpoint
          printf '%s\n' "${secret_names[@]}" | grep -Fxq content-safety-key
          ! printf '%s\n' "${secret_names[@]}" | \
            grep -Eix 'inat-submit-token|inat-oauth-token'

          if [[ "${CV_ENABLED}" == true ]]; then
            printf '%s\n' "${secret_names[@]}" | grep -Fxq inat-cv-token
            expires_at="$(az keyvault secret show \
              --vault-name "${AZURE_KEY_VAULT}" \
              --name inat-cv-token \
              --query attributes.expires \
              --output tsv)"
            expires_unix="$(date -u -d "${expires_at}" +%s)"
            remaining="$((expires_unix - $(date -u +%s)))"
            test "${remaining}" -ge 1800
            jq -n \
              --arg expires_at "${expires_at}" \
              --argjson remaining_seconds "${remaining}" \
              '{
                secret_name:"inat-cv-token",
                expires_at:$expires_at,
                remaining_seconds:$remaining_seconds
              }' > promotion-artifact/inat-cv-expiry.json
          fi

      - name: Build one immutable API image
        run: |
          set -euo pipefail
          az acr build \
            --registry "${AZURE_ACR_NAME}" \
            --image "${IMAGE_REPOSITORY}:${GITHUB_SHA}" \
            --file backend/Dockerfile \
            . --output none
          IMAGE_DIGEST="$(az acr manifest show-metadata \
            --registry "${AZURE_ACR_NAME}" \
            --name "${IMAGE_REPOSITORY}:${GITHUB_SHA}" \
            --query digest --output tsv)"
          [[ "${IMAGE_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]
          IMAGE="${AZURE_ACR_NAME}.azurecr.io/${IMAGE_REPOSITORY}@${IMAGE_DIGEST}"
          echo "IMAGE_DIGEST=${IMAGE_DIGEST}" >> "${GITHUB_ENV}"
          echo "IMAGE=${IMAGE}" >> "${GITHUB_ENV}"
          jq --arg digest "${IMAGE_DIGEST}" \
            '.image_digest=$digest' promotion-artifact/promotion.json \
            > promotion-artifact/promotion.tmp
          mv promotion-artifact/promotion.tmp promotion-artifact/promotion.json

      - name: Resolve Alembic head and require exact QA job inventory
        run: |
          set -euo pipefail
          ALEMBIC_HEAD="$(cd backend && uv run alembic heads | awk '{print $1}')"
          test "$(wc -w <<<"${ALEMBIC_HEAD}")" = 1
          echo "ALEMBIC_HEAD=${ALEMBIC_HEAD}" >> "${GITHUB_ENV}"

          required_jobs=(
            hinterland-qa-moderation
            hinterland-qa-rarity-refresh
            hinterland-qa-sweep-stale-reviews
            hinterland-qa-sync-expeditions
            hinterland-qa-obs-preflight
            hinterland-qa-migrate
            hinterland-qa-taxa-catalog-ingest
            hinterland-qa-state-rebuild
            hinterland-qa-mod-outbox-relay
            hinterland-qa-dispatcher-replay
            hinterland-qa-obs-retention
            hinterland-qa-obs-health
            hinterland-qa-expedition-funnel
            hinterland-qa-photo-revocation-replay
          )
          mapfile -t actual_jobs < <(az containerapp job list \
            --resource-group "${AZURE_RESOURCE_GROUP}" \
            --query '[].name' --output tsv)
          test "${#actual_jobs[@]}" = "${#required_jobs[@]}"
          for job in "${required_jobs[@]}"; do
            printf '%s\n' "${actual_jobs[@]}" | grep -Fxq "${job}"
          done
          for job in "${actual_jobs[@]}"; do
            [[ "${job}" == hinterland-qa-* ]]
            secret_names="$(az containerapp job secret list \
              --name "${job}" --resource-group "${AZURE_RESOURCE_GROUP}" \
              --query '[].name' --output tsv)"
            grep -Fxq pg-password <<<"${secret_names}"
            ! grep -Eixq 'inat-submit-token|inat-oauth-token|inat-cv-token' \
              <<<"${secret_names}"
          done

      - name: Pin only preflight and migration to the new digest
        run: |
          set -euo pipefail
          jobs_identity_id="$(az identity show \
            --name "${AZURE_JOBS_UAMI}" \
            --resource-group "${AZURE_RESOURCE_GROUP}" \
            --query id --output tsv)"
          jobs_identity_client_id="$(az identity show \
            --name "${AZURE_JOBS_UAMI}" \
            --resource-group "${AZURE_RESOURCE_GROUP}" \
            --query clientId --output tsv)"
          test -n "${jobs_identity_client_id}"
          common_runtime=(
            AZURE_CLIENT_ID="${jobs_identity_client_id}"
            HINTERLAND_ENV=prod
            "HINTERLAND_APP_NAME=Hinterland API"
            HINTERLAND_APP_VERSION="${GITHUB_SHA}"
            HINTERLAND_DEPLOYMENT_IMAGE_DIGEST="${IMAGE_DIGEST}"
            HINTERLAND_RELEASE_LANE=adult_qa
            HINTERLAND_LOG_LEVEL=INFO
            HINTERLAND_CORS_ORIGINS="${QA_CORS_ORIGINS}"
