              --name "${job}" \
              --resource-group "${AZURE_RESOURCE_GROUP}" \
              --secrets \
                "pg-password=keyvaultref:${QA_KEY_VAULT_URL}secrets/postgres-qa-password,identityref:${jobs_identity_id}" \
              --output none
            az containerapp job update \
              --name "${job}" \
              --resource-group "${AZURE_RESOURCE_GROUP}" \
              --image "${IMAGE}" \
              --replace-env-vars "${common_runtime[@]}" \
              --output none
            env_names="$(az containerapp job show \
              --name "${job}" \
              --resource-group "${AZURE_RESOURCE_GROUP}" \
              --query 'properties.template.containers[0].env[].name' \
              --output tsv)"
            mapfile -t stale_provider_vars < <(
