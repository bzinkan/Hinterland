            --secrets \
              "content-safety-endpoint=keyvaultref:${QA_KEY_VAULT_URL}secrets/content-safety-endpoint,identityref:${jobs_identity_id}" \
              "content-safety-key=keyvaultref:${QA_KEY_VAULT_URL}secrets/content-safety-key,identityref:${jobs_identity_id}" \
            --output none
          az containerapp job update \
            --name hinterland-qa-moderation \
