              HINTERLAND_CONTENT_SAFETY_KEY=secretref:content-safety-key \
            --output none
          az containerapp job update \
            --name hinterland-qa-state-rebuild \
            --resource-group "${AZURE_RESOURCE_GROUP}" \
            --set-env-vars \
              HINTERLAND_DERIVED_REBUILD_STRICT_DRAIN=true \
              HINTERLAND_DERIVED_REBUILD_MAX_PASSES=20 \
            --output none

      - name: Run catalog, Expeditions, and strict rebuild
        run: |
          set -euo pipefail
          run_job() {
            local job="$1" execution status=""
            execution="$(az containerapp job start \
              --name "${job}" --resource-group "${AZURE_RESOURCE_GROUP}" \
              --query name --output tsv)"
            for _ in $(seq 1 90); do
              status="$(az containerapp job execution show \
                --name "${job}" --job-execution-name "${execution}" \
                --resource-group "${AZURE_RESOURCE_GROUP}" \
                --query properties.status --output tsv)"
              case "${status}" in
                Succeeded|Failed|Canceled) break ;;
              esac
              sleep 10
            done
            jq --arg job "${job}" --arg execution "${execution}" \
              --arg status "${status}" \
              '. + [{job:$job, execution:$execution, status:$status}]' \
              promotion-artifact/job-executions.json \
              > promotion-artifact/job-executions.tmp
            mv promotion-artifact/job-executions.tmp \
              promotion-artifact/job-executions.json
            test "${status}" = Succeeded
          }
          run_job hinterland-qa-taxa-catalog-ingest
          run_job hinterland-qa-sync-expeditions
          run_job hinterland-qa-state-rebuild

      - name: Deploy API last with controlled CV and no public submit
        run: |
          set -euo pipefail
          identity_id="$(az identity show \
            --name "${AZURE_API_UAMI}" \
            --resource-group "${AZURE_RESOURCE_GROUP}" \
            --query id --output tsv)"
          identity_client_id="$(az identity show \
            --name "${AZURE_API_UAMI}" \
            --resource-group "${AZURE_RESOURCE_GROUP}" \
            --query clientId --output tsv)"
          test -n "${identity_id}"
          test -n "${identity_client_id}"
          api_secrets=(
            "pg-password=keyvaultref:${QA_KEY_VAULT_URL}secrets/postgres-qa-password,identityref:${identity_id}"
            "content-safety-endpoint=keyvaultref:${QA_KEY_VAULT_URL}secrets/content-safety-endpoint,identityref:${identity_id}"
            "content-safety-key=keyvaultref:${QA_KEY_VAULT_URL}secrets/content-safety-key,identityref:${identity_id}"
          )
          cv_token_setting=()
          if [[ "${CV_ENABLED}" == true ]]; then
            api_secrets+=(
              "inat-cv-token=keyvaultref:${QA_KEY_VAULT_URL}secrets/inat-cv-token,identityref:${identity_id}"
            )
            cv_token_setting=(
              HINTERLAND_INAT_CV_TOKEN=secretref:inat-cv-token
            )
          fi
          az containerapp secret set \
            --name "${AZURE_CONTAINER_APP}" \
            --resource-group "${AZURE_RESOURCE_GROUP}" \
            --secrets "${api_secrets[@]}" \
            --output none
          common_runtime=(
            AZURE_CLIENT_ID="${identity_client_id}"
            HINTERLAND_ENV=prod
            "HINTERLAND_APP_NAME=Hinterland API"
            HINTERLAND_APP_VERSION="${GITHUB_SHA}"
            HINTERLAND_DEPLOYMENT_IMAGE_DIGEST="${IMAGE_DIGEST}"
            HINTERLAND_RELEASE_LANE=adult_qa
            HINTERLAND_LOG_LEVEL=INFO
            HINTERLAND_CORS_ORIGINS="${QA_CORS_ORIGINS}"
            HINTERLAND_PARENT_WEB_BASE_URL="${QA_PARENT_ORIGIN}"
            HINTERLAND_ADULT_QA_CONSENT_POLICY_VERSION="${QA_CONSENT_POLICY_VERSION}"
            HINTERLAND_SHARED_GROUPS_ENABLED="${SHARED_GROUPS_ENABLED}"
            HINTERLAND_SHARED_GROUPS_CANARY_GROUP_IDS=[]
            HINTERLAND_PHOTOS_BUCKET="${AZURE_PHOTOS_CONTAINER}"
            HINTERLAND_TAXONOMY_PACKS_BUCKET="${AZURE_TAXONOMY_PACKS_CONTAINER}"
            HINTERLAND_OBSERVATION_IDEMPOTENCY_REQUIRED=true
            HINTERLAND_CONTENT_ROOT=/app/content/expeditions
            HINTERLAND_STORAGE_PROVIDER=blob
            HINTERLAND_BLOB_ACCOUNT_ENDPOINT="${QA_BLOB_ACCOUNT_ENDPOINT}"
            HINTERLAND_ENTRA_TENANT_ID="${QA_ENTRA_TENANT_ID}"
            HINTERLAND_ENTRA_API_AUDIENCE="${QA_ENTRA_API_AUDIENCE}"
            HINTERLAND_ENTRA_CLIENT_APP_ID="${QA_ENTRA_CLIENT_ID}"
            HINTERLAND_ENTRA_REQUIRED_SCOPE=user.access
            HINTERLAND_ENTRA_ISSUER="https://login.microsoftonline.com/${QA_ENTRA_TENANT_ID}/v2.0"
            HINTERLAND_ENTRA_JWKS_URL="https://login.microsoftonline.com/${QA_ENTRA_TENANT_ID}/discovery/v2.0/keys"
            HINTERLAND_KID_JWT_ISSUER="${QA_KID_JWT_ISSUER}"
            HINTERLAND_KID_JWT_AUDIENCE="${QA_KID_JWT_AUDIENCE}"
            HINTERLAND_KID_JWT_KID="${QA_KID_JWT_KID}"
            HINTERLAND_KEY_VAULT_URL="${QA_KEY_VAULT_URL}"
            HINTERLAND_KEY_VAULT_KID_SIGNING_SECRET="${QA_KID_SIGNING_SECRET}"
            HINTERLAND_KEY_VAULT_KID_PUBLIC_SECRET="${QA_KID_PUBLIC_SECRET}"
            HINTERLAND_INAT_BASE_URL=https://api.inaturalist.org/v1
            HINTERLAND_INAT_CV_ENABLED="${CV_ENABLED}"
            HINTERLAND_INAT_CV_DISCLOSURE_APPROVED="${CV_DISCLOSURE_APPROVED}"
            HINTERLAND_INAT_CV_BENCHMARK_APPROVED="${CV_BENCHMARK_APPROVED}"
            HINTERLAND_INAT_CV_QUALIFICATION_ENABLED=false
            HINTERLAND_INAT_SUBMIT_ENABLED=false
            HINTERLAND_ORGANISM_FALLBACK_PROVIDER=noop
            HINTERLAND_GEOCODING_PROVIDER=noop
            HINTERLAND_MODERATION_PROVIDER=azure_content_safety
            HINTERLAND_CONTENT_SAFETY_ENDPOINT=secretref:content-safety-endpoint
            HINTERLAND_CONTENT_SAFETY_KEY=secretref:content-safety-key
            HINTERLAND_SERVICE_BUS_NAMESPACE="${AZURE_SERVICE_BUS_NAMESPACE}.servicebus.windows.net"
            HINTERLAND_SERVICE_BUS_MODERATION_QUEUE="${AZURE_MODERATION_QUEUE}"
            HINTERLAND_SERVICE_BUS_INAT_QUEUE="${AZURE_DISABLED_INAT_QUEUE}"
            HINTERLAND_DATABASE_HOST="${AZURE_POSTGRES_HOST}"
            HINTERLAND_DATABASE_PORT=5432
            HINTERLAND_DATABASE_NAME="${AZURE_POSTGRES_DATABASE}"
            HINTERLAND_DATABASE_USER="${AZURE_POSTGRES_USER}"
            HINTERLAND_DATABASE_PASSWORD=secretref:pg-password
            HINTERLAND_READINESS_DATABASE_REQUIRED=true
            HINTERLAND_DEV_AUTH_ENABLED=false
            HINTERLAND_ALLOW_STUB_AUTH=false
          )

          az containerapp update \
            --name "${AZURE_CONTAINER_APP}" \
            --resource-group "${AZURE_RESOURCE_GROUP}" \
            --image "${IMAGE}" \
            --replace-env-vars "${common_runtime[@]}" "${cv_token_setting[@]}" \
            --output none

          env_names="$(az containerapp show \
            --name "${AZURE_CONTAINER_APP}" \
            --resource-group "${AZURE_RESOURCE_GROUP}" \
            --query 'properties.template.containers[0].env[].name' \
            --output tsv)"
          retired_exact=(
            HINTERLAND_DATABASE_PASSWORD_SECRET
            HINTERLAND_DEV_AUTH_TOKEN
            HINTERLAND_KID_JWT_SIGNING_PEM
            HINTERLAND_KID_JWT_PUBLIC_PEM
            HINTERLAND_INAT_CV_QUALIFICATION_KEY
            HINTERLAND_INAT_CV_QUALIFICATION_RUN_ID
            HINTERLAND_INAT_CV_QUALIFICATION_MANIFEST_SHA256
            HINTERLAND_INAT_CV_QUALIFICATION_EXPIRES_AT
            HINTERLAND_INAT_CV_QUALIFICATION_CASES
            HINTERLAND_INAT_SUBMIT_TOKEN
            HINTERLAND_INAT_OAUTH_TOKEN
          )
          if [[ "${CV_ENABLED}" != true ]]; then
            retired_exact+=(HINTERLAND_INAT_CV_TOKEN)
          fi
          mapfile -t stale_api_vars < <(
            {
              grep -Ei '^DRA[G]ONFLY_' <<<"${env_names}" || true
              for variable in "${retired_exact[@]}"; do
                grep -Fx "${variable}" <<<"${env_names}" || true
              done
            } | sort -u
          )
          if (( ${#stale_api_vars[@]} > 0 )); then
            az containerapp update \
              --name "${AZURE_CONTAINER_APP}" \
              --resource-group "${AZURE_RESOURCE_GROUP}" \
              --remove-env-vars "${stale_api_vars[@]}" \
              --output none
          fi

      - name: Wait for exact healthy API revision
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 900))
          API_READY_REVISION=""
          while (( SECONDS < deadline )); do
            app_json="$(az containerapp show --name "${AZURE_CONTAINER_APP}" \
              --resource-group "${AZURE_RESOURCE_GROUP}" --output json)"
            latest="$(jq -r '.properties.latestRevisionName // empty' <<<"${app_json}")"
            ready="$(jq -r '.properties.latestReadyRevisionName // empty' <<<"${app_json}")"
            if [[ -n "${latest}" && "${latest}" = "${ready}" ]]; then
              revision_json="$(az containerapp revision show \
                --name "${AZURE_CONTAINER_APP}" \
                --resource-group "${AZURE_RESOURCE_GROUP}" \
                --revision "${latest}" --output json)"
              revision_image="$(jq -r '.properties.template.containers[0].image' \
                <<<"${revision_json}")"
              version="$(jq -r '
                [.properties.template.containers[0].env[]
                  | select(.name == "HINTERLAND_APP_VERSION") | .value][0] // empty
              ' <<<"${revision_json}")"
              if [[ "${revision_image}" = "${IMAGE}" && \
                    "${version}" = "${GITHUB_SHA}" && \
                    "$(jq -r '.properties.healthState' <<<"${revision_json}")" = Healthy ]]; then
                echo "API_READY_REVISION=${latest}" >> "${GITHUB_ENV}"
                API_READY_REVISION="${latest}"
                break
              fi
            fi
            sleep 10
          done
          test -n "${API_READY_REVISION:-}"

          forbidden_app_secrets=(
            dev-auth-token
            inat-oauth-token
            inat-submit-token
            inat-cv-qualification-key
          )
          if [[ "${CV_ENABLED}" != true ]]; then
            forbidden_app_secrets+=(inat-cv-token)
          fi
          for _ in $(seq 1 6); do
            app_secret_names="$(az containerapp secret list \
              --name "${AZURE_CONTAINER_APP}" \
              --resource-group "${AZURE_RESOURCE_GROUP}" \
              --query '[].name' --output tsv)"
            secrets_to_remove=()
            for secret in "${forbidden_app_secrets[@]}"; do
              if grep -Fxq "${secret}" <<<"${app_secret_names}"; then
                secrets_to_remove+=("${secret}")
              fi
            done
            if (( ${#secrets_to_remove[@]} == 0 )); then
              break
            fi
            if ! az containerapp secret remove \
              --name "${AZURE_CONTAINER_APP}" \
              --resource-group "${AZURE_RESOURCE_GROUP}" \
              --secret-names "${secrets_to_remove[@]}" \
              --output none; then
              echo "Retrying stale QA API secret removal." >&2
            fi
            sleep 5
          done
          app_secret_names="$(az containerapp secret list \
            --name "${AZURE_CONTAINER_APP}" \
            --resource-group "${AZURE_RESOURCE_GROUP}" \
            --query '[].name' --output tsv)"
          for secret in "${forbidden_app_secrets[@]}"; do
            ! grep -Fxq "${secret}" <<<"${app_secret_names}"
          done

      - name: Export and deploy exact QA parent web
        working-directory: mobile
        env:
          APP_ENV: adult-qa
          HINTERLAND_QA_EAS_PROJECT_ID: ${{ vars.HINTERLAND_QA_EAS_PROJECT_ID }}
          HINTERLAND_QA_ENTRA_API_AUDIENCE: ${{ vars.HINTERLAND_QA_ENTRA_API_AUDIENCE }}
          HINTERLAND_QA_ENTRA_CLIENT_ID: ${{ vars.HINTERLAND_QA_ENTRA_CLIENT_ID }}
          HINTERLAND_QA_ENTRA_TENANT_ID: ${{ vars.HINTERLAND_QA_ENTRA_TENANT_ID }}
        run: |
          set -euo pipefail
          npx expo export --platform web
          npm run config:parent-web -- --dist
          mkdir -p dist/.well-known
          jq -n --arg sha "${GITHUB_SHA}" \
            '{surface:"parents-qa", commit_sha:$sha, release_lane:"adult_qa"}' \
            > dist/.well-known/hinterland-build.json

      - name: Bind the protected parent deployment token to the QA Static Web App
        env:
          HINTERLAND_QA_PARENTS_SWA_TOKEN: ${{ secrets.HINTERLAND_QA_PARENTS_SWA_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${HINTERLAND_QA_PARENTS_SWA_TOKEN}"
          echo "::add-mask::${HINTERLAND_QA_PARENTS_SWA_TOKEN}"
          expected_token="$(az staticwebapp secrets list \
            --name "${AZURE_PARENT_SWA}" \
            --resource-group "${AZURE_RESOURCE_GROUP}" \
            --query properties.apiKey --output tsv)"
          test -n "${expected_token}"
          echo "::add-mask::${expected_token}"
          HINTERLAND_EXPECTED_SWA_TOKEN="${expected_token}" python - <<'PY'
          import hmac
          import os

          if not hmac.compare_digest(
              os.environ["HINTERLAND_QA_PARENTS_SWA_TOKEN"],
              os.environ["HINTERLAND_EXPECTED_SWA_TOKEN"],
          ):
              raise SystemExit(
                  "protected parent deployment token is not bound to the QA Static Web App"
              )
          PY
          unset expected_token

      - name: Upload QA parent web
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.HINTERLAND_QA_PARENTS_SWA_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: mobile/dist
          output_location: ""
          skip_app_build: true

      - name: Verify release lane, readiness, parent web, digest, and queues
        run: |
          set -euo pipefail
          for attempt in $(seq 1 36); do
            if health="$(curl --fail --silent --show-error "${QA_API_ORIGIN}/health")" &&
              ready="$(curl --fail --silent --show-error "${QA_API_ORIGIN}/ready")" &&
              meta_headers="$(mktemp)" &&
              meta="$(curl --fail --silent --show-error \
                --dump-header "${meta_headers}" "${QA_API_ORIGIN}/v1/meta")" &&
              jq -e --arg sha "${GITHUB_SHA}" \
                '.status == "ok" and .version == $sha' <<<"${health}" >/dev/null &&
              jq -e --arg sha "${GITHUB_SHA}" \
                '.status == "ready" and .version == $sha and
                 any(.checks[]; .name == "database" and .status == "ok")' \
                <<<"${ready}" >/dev/null &&
              jq -e \
                --arg sha "${GITHUB_SHA}" \
                --arg digest "${IMAGE_DIGEST}" \
                --argjson cv_enabled "${CV_ENABLED}" '
                .release_lane == "adult_qa" and
                .version == $sha and
                .image_digest == $digest and
                .capabilities.integrations.content_safety_enabled == true and
                .capabilities.integrations.public_inat_submission_enabled == false and
                .capabilities.integrations.cv_qualification_enabled == false and
                .capabilities.observation.photo_helper_enabled == $cv_enabled
              ' <<<"${meta}" >/dev/null &&
              grep -Eiq '^x-hinterland-release-lane:[[:space:]]*adult_qa' \
                "${meta_headers}"; then
              rm -f "${meta_headers}"
              break
            fi
            rm -f "${meta_headers:-}"
            if [[ "${attempt}" = 36 ]]; then
              echo "QA API did not converge to the exact release lane." >&2
              exit 1
            fi
            sleep 5
          done
          curl --fail --silent --show-error \
            "${QA_API_ORIGIN}${HINTERLAND_KID_JWKS_PATH}" | \
            jq -e '.keys | length > 0' >/dev/null
          curl --fail --silent --show-error \
            "${QA_PARENT_ORIGIN}/.well-known/hinterland-build.json" | \
            jq -e --arg sha "${GITHUB_SHA}" '
              .surface == "parents-qa" and .commit_sha == $sha and
              .release_lane == "adult_qa"
            ' >/dev/null

          expected_common=(
            HINTERLAND_ENV=prod
            "HINTERLAND_APP_NAME=Hinterland API"
            HINTERLAND_APP_VERSION="${GITHUB_SHA}"
            HINTERLAND_DEPLOYMENT_IMAGE_DIGEST="${IMAGE_DIGEST}"
            HINTERLAND_RELEASE_LANE=adult_qa
            HINTERLAND_LOG_LEVEL=INFO
            HINTERLAND_CORS_ORIGINS="${QA_CORS_ORIGINS}"
            HINTERLAND_PARENT_WEB_BASE_URL="${QA_PARENT_ORIGIN}"
            HINTERLAND_ADULT_QA_CONSENT_POLICY_VERSION="${QA_CONSENT_POLICY_VERSION}"
            HINTERLAND_SHARED_GROUPS_ENABLED="${SHARED_GROUPS_ENABLED}"
            HINTERLAND_SHARED_GROUPS_CANARY_GROUP_IDS=[]
            HINTERLAND_PHOTOS_BUCKET="${AZURE_PHOTOS_CONTAINER}"
            HINTERLAND_TAXONOMY_PACKS_BUCKET="${AZURE_TAXONOMY_PACKS_CONTAINER}"
            HINTERLAND_OBSERVATION_IDEMPOTENCY_REQUIRED=true
            HINTERLAND_CONTENT_ROOT=/app/content/expeditions
            HINTERLAND_STORAGE_PROVIDER=blob
            HINTERLAND_BLOB_ACCOUNT_ENDPOINT="${QA_BLOB_ACCOUNT_ENDPOINT}"
            HINTERLAND_ENTRA_TENANT_ID="${QA_ENTRA_TENANT_ID}"
            HINTERLAND_ENTRA_API_AUDIENCE="${QA_ENTRA_API_AUDIENCE}"
            HINTERLAND_ENTRA_CLIENT_APP_ID="${QA_ENTRA_CLIENT_ID}"
            HINTERLAND_ENTRA_REQUIRED_SCOPE=user.access
            HINTERLAND_ENTRA_ISSUER="https://login.microsoftonline.com/${QA_ENTRA_TENANT_ID}/v2.0"
            HINTERLAND_ENTRA_JWKS_URL="https://login.microsoftonline.com/${QA_ENTRA_TENANT_ID}/discovery/v2.0/keys"
            HINTERLAND_KID_JWT_ISSUER="${QA_KID_JWT_ISSUER}"
            HINTERLAND_KID_JWT_AUDIENCE="${QA_KID_JWT_AUDIENCE}"
            HINTERLAND_KID_JWT_KID="${QA_KID_JWT_KID}"
            HINTERLAND_KEY_VAULT_URL="${QA_KEY_VAULT_URL}"
            HINTERLAND_KEY_VAULT_KID_SIGNING_SECRET="${QA_KID_SIGNING_SECRET}"
            HINTERLAND_KEY_VAULT_KID_PUBLIC_SECRET="${QA_KID_PUBLIC_SECRET}"
            HINTERLAND_INAT_BASE_URL=https://api.inaturalist.org/v1
            HINTERLAND_INAT_SUBMIT_ENABLED=false
            HINTERLAND_ORGANISM_FALLBACK_PROVIDER=noop
            HINTERLAND_GEOCODING_PROVIDER=noop
            HINTERLAND_SERVICE_BUS_NAMESPACE="${AZURE_SERVICE_BUS_NAMESPACE}.servicebus.windows.net"
            HINTERLAND_SERVICE_BUS_MODERATION_QUEUE="${AZURE_MODERATION_QUEUE}"
            HINTERLAND_SERVICE_BUS_INAT_QUEUE="${AZURE_DISABLED_INAT_QUEUE}"
            HINTERLAND_DATABASE_HOST="${AZURE_POSTGRES_HOST}"
            HINTERLAND_DATABASE_PORT=5432
            HINTERLAND_DATABASE_NAME="${AZURE_POSTGRES_DATABASE}"
            HINTERLAND_DATABASE_USER="${AZURE_POSTGRES_USER}"
            HINTERLAND_DATABASE_PASSWORD=secretref:pg-password
            HINTERLAND_READINESS_DATABASE_REQUIRED=true
            HINTERLAND_DEV_AUTH_ENABLED=false
            HINTERLAND_ALLOW_STUB_AUTH=false
          )
          forbidden_env=(
            HINTERLAND_DATABASE_PASSWORD_SECRET
            HINTERLAND_DEV_AUTH_TOKEN
            HINTERLAND_KID_JWT_SIGNING_PEM
            HINTERLAND_KID_JWT_PUBLIC_PEM
            HINTERLAND_INAT_OAUTH_TOKEN
            HINTERLAND_INAT_SUBMIT_TOKEN
            HINTERLAND_INAT_CV_QUALIFICATION_KEY
            HINTERLAND_INAT_CV_QUALIFICATION_RUN_ID
            HINTERLAND_INAT_CV_QUALIFICATION_MANIFEST_SHA256
            HINTERLAND_INAT_CV_QUALIFICATION_EXPIRES_AT
            HINTERLAND_INAT_CV_QUALIFICATION_CASES
          )
          assert_runtime_map() {
            local json="$1" provider="$2" cv_enabled="$3"
            local expected_azure_client_id="$4"
            local pair name expected actual
            for pair in "${expected_common[@]}"; do
              name="${pair%%=*}"
              expected="${pair#*=}"
              actual="$(jq -r --arg name "${name}" '
                [.properties.template.containers[0].env[] |
                  select(.name == $name) |
                  if .secretRef then "secretref:" + .secretRef else .value end
                ][0] // empty
              ' <<<"${json}")"
              test "${actual}" = "${expected}"
            done
            test "$(jq --arg name AZURE_CLIENT_ID '
              [.properties.template.containers[0].env[] |
                select(.name == $name)] | length
            ' <<<"${json}")" = 1
            test "$(jq -r --arg name AZURE_CLIENT_ID '
              [.properties.template.containers[0].env[] |
                select(.name == $name) | .value][0] // empty
            ' <<<"${json}")" = "${expected_azure_client_id}"
            test "$(jq -r '
              [.properties.template.containers[0].env[] |
                select(.name == "HINTERLAND_MODERATION_PROVIDER") |
                .value][0] // empty
            ' <<<"${json}")" = "${provider}"
            test "$(jq -r '
              [.properties.template.containers[0].env[] |
                select(.name == "HINTERLAND_INAT_CV_ENABLED") |
                .value][0] // empty
            ' <<<"${json}")" = "${cv_enabled}"
            env_names="$(jq -r \
              '.properties.template.containers[0].env[].name' <<<"${json}")"
            ! grep -Eiq '^DRA[G]ONFLY_' <<<"${env_names}"
            for name in "${forbidden_env[@]}"; do
              ! grep -Fxq "${name}" <<<"${env_names}"
            done
            ! jq -r '
              .properties.template.containers[0].env[] |
              .value // empty
            ' <<<"${json}" | grep -Eiq \
              'hinterland-kv-dev|hinterlandphotosdev|hinterland-sb-dev|https://(api|parents)\.thehinterlandguide\.app($|[",])'
          }
          assert_secret_ref() {
            local secrets="$1" name="$2" vault_secret="$3" identity_id="$4"
            jq -e \
              --arg name "${name}" \
              --arg url "${QA_KEY_VAULT_URL}secrets/${vault_secret}" \
              --arg identity "${identity_id,,}" '
                any(.[];
                  .name == $name and
                  ((.keyVaultUrl // "") | ascii_downcase) ==
                    ($url | ascii_downcase) and
                  ((.identity // "") | ascii_downcase) == $identity)
              ' <<<"${secrets}" >/dev/null
          }

          api_identity_json="$(az identity show --name "${AZURE_API_UAMI}" \
            --resource-group "${AZURE_RESOURCE_GROUP}" --output json)"
          jobs_identity_json="$(az identity show --name "${AZURE_JOBS_UAMI}" \
            --resource-group "${AZURE_RESOURCE_GROUP}" --output json)"
          api_identity_id="$(jq -r '.id' <<<"${api_identity_json}")"
          api_identity_client_id="$(jq -r '.clientId' <<<"${api_identity_json}")"
          jobs_identity_id="$(jq -r '.id' <<<"${jobs_identity_json}")"
          jobs_identity_client_id="$(jq -r '.clientId' <<<"${jobs_identity_json}")"
          test -n "${api_identity_id}"
          test -n "${api_identity_client_id}"
          test -n "${jobs_identity_id}"
          test -n "${jobs_identity_client_id}"

          app_json="$(az containerapp show \
            --name "${AZURE_CONTAINER_APP}" \
            --resource-group "${AZURE_RESOURCE_GROUP}" --output json)"
          test "$(jq -r '.properties.template.containers[0].image' \
            <<<"${app_json}")" = "${IMAGE}"
          assert_runtime_map "${app_json}" azure_content_safety "${CV_ENABLED}" \
            "${api_identity_client_id}"
          test "$(jq -r '
            [.properties.template.containers[0].env[] |
              select(.name == "HINTERLAND_INAT_CV_DISCLOSURE_APPROVED") |
              .value][0] // empty
          ' <<<"${app_json}")" = "${CV_DISCLOSURE_APPROVED}"
          test "$(jq -r '
            [.properties.template.containers[0].env[] |
              select(.name == "HINTERLAND_INAT_CV_BENCHMARK_APPROVED") |
              .value][0] // empty
          ' <<<"${app_json}")" = "${CV_BENCHMARK_APPROVED}"
          test "$(jq -r '
            [.properties.template.containers[0].env[] |
              select(.name == "HINTERLAND_INAT_CV_QUALIFICATION_ENABLED") |
              .value][0] // empty
          ' <<<"${app_json}")" = false
          for pair in \
            HINTERLAND_CONTENT_SAFETY_ENDPOINT=content-safety-endpoint \
            HINTERLAND_CONTENT_SAFETY_KEY=content-safety-key; do
            name="${pair%%=*}"
            secret="${pair#*=}"
            test "$(jq -r --arg name "${name}" '
              [.properties.template.containers[0].env[] |
                select(.name == $name) | .secretRef][0] // empty
            ' <<<"${app_json}")" = "${secret}"
          done
          app_secrets="$(az containerapp secret list \
            --name "${AZURE_CONTAINER_APP}" \
            --resource-group "${AZURE_RESOURCE_GROUP}" --output json)"
          assert_secret_ref "${app_secrets}" pg-password \
            postgres-qa-password "${api_identity_id}"
          assert_secret_ref "${app_secrets}" content-safety-endpoint \
            content-safety-endpoint "${api_identity_id}"
          assert_secret_ref "${app_secrets}" content-safety-key \
            content-safety-key "${api_identity_id}"
          expected_app_secret_count=3
          if [[ "${CV_ENABLED}" = true ]]; then
            assert_secret_ref "${app_secrets}" inat-cv-token \
              inat-cv-token "${api_identity_id}"
            expected_app_secret_count=4
          fi
          test "$(jq 'length' <<<"${app_secrets}")" = \
            "${expected_app_secret_count}"

          mapfile -t jobs < <(az containerapp job list \
            --resource-group "${AZURE_RESOURCE_GROUP}" \
            --query '[].name' --output tsv)
          for job in "${jobs[@]}"; do
            job_json="$(az containerapp job show --name "${job}" \
              --resource-group "${AZURE_RESOURCE_GROUP}" --output json)"
            test "$(jq -r '.properties.template.containers[0].image' \
              <<<"${job_json}")" = "${IMAGE}"
            if [[ "${job}" = hinterland-qa-moderation ]]; then
              assert_runtime_map "${job_json}" azure_content_safety false \
                "${jobs_identity_client_id}"
              for pair in \
                HINTERLAND_CONTENT_SAFETY_ENDPOINT=content-safety-endpoint \
                HINTERLAND_CONTENT_SAFETY_KEY=content-safety-key; do
                name="${pair%%=*}"
                secret="${pair#*=}"
                test "$(jq -r --arg name "${name}" '
                  [.properties.template.containers[0].env[] |
                    select(.name == $name) | .secretRef][0] // empty
                ' <<<"${job_json}")" = "${secret}"
              done
            else
              assert_runtime_map "${job_json}" noop false \
                "${jobs_identity_client_id}"
            fi
            job_secrets="$(az containerapp job secret list \
              --name "${job}" \
              --resource-group "${AZURE_RESOURCE_GROUP}" --output json)"
            assert_secret_ref "${job_secrets}" pg-password \
              postgres-qa-password "${jobs_identity_id}"
            expected_job_secret_count=1
            if [[ "${job}" = hinterland-qa-moderation ]]; then
              assert_secret_ref "${job_secrets}" content-safety-endpoint \
                content-safety-endpoint "${jobs_identity_id}"
              assert_secret_ref "${job_secrets}" content-safety-key \
                content-safety-key "${jobs_identity_id}"
              expected_job_secret_count=3
            fi
            test "$(jq 'length' <<<"${job_secrets}")" = \
              "${expected_job_secret_count}"
          done

          queue_json="$(az servicebus queue show \
            --namespace-name "${AZURE_SERVICE_BUS_NAMESPACE}" \
            --resource-group "${AZURE_RESOURCE_GROUP}" \
            --name "${AZURE_MODERATION_QUEUE}" --output json)"
          active_count="$(jq -r '.countDetails.activeMessageCount' <<<"${queue_json}")"
          dlq_count="$(jq -r '.countDetails.deadLetterMessageCount' <<<"${queue_json}")"
          test "${active_count}" = 0
          test "${dlq_count}" = 0

          jq \
            --arg revision "${API_READY_REVISION}" \
            --arg alembic_head "${ALEMBIC_HEAD}" \
            --arg digest "${IMAGE_DIGEST}" \
            --argjson queue_active "${active_count}" \
            --argjson queue_dlq "${dlq_count}" \
            '.deployment={
               api_revision:$revision,
               alembic_head:$alembic_head,
               image_digest:$digest,
               api_domain:"qa-api.thehinterlandguide.app",
               parent_domain:"qa-parents.thehinterlandguide.app",
               region:"centralus",
               database:"hinterland_qa",
               queue_active:$queue_active,
               queue_dlq:$queue_dlq
             }' promotion-artifact/promotion.json \
            > promotion-artifact/promotion.tmp
          mv promotion-artifact/promotion.tmp promotion-artifact/promotion.json

      - name: Non-skipped authenticated parent, kid, and Adult QA Observation canary
        env:
          HINTERLAND_API_BASE_URL: https://qa-api.thehinterlandguide.app
          HINTERLAND_QA_SMOKE_ENTRA_BEARER: ${{ secrets.HINTERLAND_QA_SMOKE_ENTRA_BEARER }}
          HINTERLAND_SMOKE_EVIDENCE_PATH: promotion-artifact/authenticated-canary.json
        run: |
          set -euo pipefail
          test -n "${HINTERLAND_QA_SMOKE_ENTRA_BEARER}"
          python - <<'PY'
          import base64
          import json
          import os
          import time

          token = os.environ["HINTERLAND_QA_SMOKE_ENTRA_BEARER"]
          payload = token.split(".", 2)[1]
          payload += "=" * (-len(payload) % 4)
          expires_at = int(json.loads(base64.urlsafe_b64decode(payload))["exp"])
          if expires_at - int(time.time()) < 900:
              raise SystemExit(
                  "QA test-parent credential needs at least 900 seconds "
                  "at the authenticated canary"
              )
          PY
          backend/.venv/bin/python scripts/smoke_adult_qa_parent_kid.py
          jq -e '
            .result == "passed" and
            .release_lane_verified == true and
            .content_safety_enabled == true and
            .public_inaturalist_submission_disabled == true and
            .idempotent_replay == true and
            .field_journal_exactly_once == true and
            .child_presentation_status == "clean" and
            .signed_photo_allowed == true and
            .child_dto_minimized == true
          ' promotion-artifact/authenticated-canary.json >/dev/null

          queue_json="$(az servicebus queue show \
            --namespace-name "${AZURE_SERVICE_BUS_NAMESPACE}" \
            --resource-group "${AZURE_RESOURCE_GROUP}" \
            --name "${AZURE_MODERATION_QUEUE}" --output json)"
          test "$(jq -r '.countDetails.activeMessageCount' <<<"${queue_json}")" = 0
          test "$(jq -r '.countDetails.deadLetterMessageCount' <<<"${queue_json}")" = 0

          jq --slurpfile canary promotion-artifact/authenticated-canary.json \
            '.authenticated_canary=($canary[0] | del(.request_ids))' \
            promotion-artifact/promotion.json \
            > promotion-artifact/promotion.tmp
          mv promotion-artifact/promotion.tmp promotion-artifact/promotion.json

      - name: Mark promotion result
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          if [[ -f promotion-artifact/promotion.json ]]; then
            jq --arg result "${JOB_STATUS}" \
              --arg completed_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              '.result=$result | .completed_at=$completed_at' \
              promotion-artifact/promotion.json \
              > promotion-artifact/promotion.tmp
            mv promotion-artifact/promotion.tmp promotion-artifact/promotion.json
          fi

      - name: Publish sanitized Adult QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adult-qa-promotion-${{ github.run_id }}
          path: promotion-artifact
          if-no-files-found: error
          retention-days: 90
