            --name "${AZURE_JOBS_UAMI}" \
            --resource-group "${AZURE_RESOURCE_GROUP}" \
            --query id --output tsv)"
          jobs_identity_client_id="$(az identity show \
            --name "${AZURE_JOBS_UAMI}" \
            --resource-group "${AZURE_RESOURCE_GROUP}" \
            --query clientId --output tsv)"
          test -n "${jobs_identity_client_id}"
          common_runtime=(
